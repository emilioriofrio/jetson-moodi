camera_device: /dev/video0
camera_index: 0
camera_type: usb
enabled_modules:
- A
- B
- C
fps: 30
fusion:
  cooldown_down: 1
  # 4->2 (S13): junto con el fix de contadores "con fuga" en core/fusion.py
  # (antes se reseteaban a 0 con cualquier lectura que no fuera estrictamente
  # mayor), esperar 4 lecturas en subida seguía siendo lento en la práctica
  # frente a lo que mostraban las capturas reales del robot. 2 sigue
  # evitando que UN solo frame ruidoso dispare una subida.
  cooldown_up: 2
  debug: false
  required_modules: 2
# 640x360 (16:9) en vez de 640x480 (4:3) -- S11. Verificado con gst-launch que
# esta camara ENTREGA 640x480 como RECORTE CENTRAL del sensor (se pierden los
# extremos izquierdo/derecho de la escena), mientras que 640x360 es el sensor
# completo reescalado: mismo campo de vision que 1280x720 pero con 25% MENOS
# pixeles que 640x480 (230k vs 307k). Gana campo de vision Y baja el costo por
# frame. Ambos son modos MJPG nativos a 30fps (no romper la regla de fps 30/25).
height: 360
modA_backends_order:
- mediapipe
modA_ema_alpha: 0.30
modA_hysteresis_margin: 1.5
modA_min_gap_for_switch: 4.0
modA_mtcnn_max_side: 720
modA_mtcnn_min_face: 20
modA_mtcnn_steps:
- 0.6
- 0.7
- 0.8
modA_roi_expand: 1.6
modA_roi_track_ticks: 0
modA_valence_extra_gap: 1.0
modA_use_clahe: true
modA_clahe_clip: 1.2
modulo_b:
  N_FRAMES: 10
  PRED_THRESH: 0.5
  SMOOTH_WINDOW: 6
  labels_map_path: dataset_vectores_v3/labels_map_v3.txt
  model_path: resultados_modb_v3/modelo_modb_v3.keras
  quality_pose_thr: 0.35
  # 20 -> 240 (S11). OJO: este umbral se mide en NÚMERO DE FRAMES, no en
  # segundos. Se calibró cuando la captura entregaba ~2.5 fps (el bucle estaba
  # encadenado al módulo más lento), donde 20 frames eran ~8 s. Al corregir el
  # bloqueo de colas la captura subió a 30 fps reales, así que 20 frames pasaron
  # a ser 0.67 s y B se declaraba "obsoleto" casi al instante. 240 frames a
  # 30 fps ≈ 8 s: mismo comportamiento en TIEMPO que el que estaba validado.
  stale_frames: 240
modulo_c:
  analyze_every: 3
  # Instrumentación de cadencia (S12): el Módulo C imprime en qué se le va el
  # tiempo entre predicción y predicción (esperar frames / Detectron2 / flujo
  # óptico / VGG16 / BiLSTM). Dejar en false salvo al medir.
  debug_timing: false
  # --- claves de S12, MEDIDAS EN EL ROBOT (ver PROGRESO_BMO_S12.md §6) ---
  # Con esto, más la GPU que el módulo nunca llegó a usar (ver run.py:
  # entry_worker_c), C pasó de una predicción cada 48 s a una cada 1.8 s,
  # sin tocar los 30 fps que llegan a la UI.
  # frame_stride: el orquestador manda 1 de cada 3 frames, en vez de mandarlos
  #   todos para que C tirase 2 de cada 3: la secuencia le llega uniformemente
  #   espaciada, que es como se entrenó el BiLSTM.
  # detectron_min_size: detectar a 360 (la resolución real) en vez de ampliar a
  #   800 como hace Detectron2 por defecto.
  # Poner ambas a 0 restaura el comportamiento de S11.
  frame_stride: 3
  detectron_min_size: 360
  # Tolerancia de hueco para considerar que la ventana sigue uniformemente
  # espaciada (solo aplica con frame_stride > 0).
  max_gap_factor: 2.5
  # Cola propia y honda para C (S12): tiene que sobrevivir a su propia
  # detección de persona sin perder frames de la ventana. 32 frames a
  # 10 fps (stride 3 sobre 30 fps) son ~3 s de margen.
  queue_maxsize: 32
  bilstm_path: moduloC_dataset/vectores_numpy/resultados_entrenamiento/bilstm_mejor_modelo.pth
  detect_every: 11
  detectron_score_thr: 0.7
  label_map_path: moduloC_dataset/vectores_numpy/label_map.json
  # 0.12 -> 0.18, ahora MEDIDO con una persona real sentada frente al robot
  # (S12), que es lo que S11 dejo pendiente: su 0.12 salia de escalar un valor
  # de laboratorio, no del caso de uso.
  #
  # Distribuciones medidas de person_ratio (la fraccion del frame que ocupa la
  # persona), 275 predicciones reales:
  #   escena VACIA  : mediana 0.053, p95 0.124, MAXIMO 0.132  (n=208)
  #   persona SENTADA: minimo 0.367, mediana 0.441, maximo 0.529  (n=67)
  # Es decir, hay un hueco enorme entre las dos y 0.12 caia DENTRO del ruido de
  # la escena vacia: 20 de 208 lecturas sin nadie delante se marcaban como
  # "hay persona". Con 0.18 no hay ni un falso presente ni un falso ausente en
  # los 275 casos.
  #
  # Se elige 0.18 y no el centro del hueco (~0.25) a proposito: el usuario final
  # es un NINO, mas pequeno que el adulto medido, y puede sentarse mas lejos.
  # 0.18 deja margen 1.4x sobre el ruido y acepta a alguien que ocupe la mitad
  # de area que el adulto medido. Si alguna vez aparecen falsos presentes con la
  # sala vacia, subirlo hacia 0.25.
  min_person_ratio: 0.18
  seq_len: 11
  # 30 -> 360 (S11), misma razón que modulo_b.stale_frames: son FRAMES, no
  # segundos. A ~2.5 fps eran ~12 s; a 30 fps reales serían 1 s, y C se
  # marcaría "inseguro" entre una predicción y la siguiente (C emite del orden
  # de una cada ~30 s). 360 frames a 30 fps ≈ 12 s.
  stale_ticks: 360
  use_gpu: true
  vgg_input:
  - 224
  - 224
prefer_mjpg: true
queues_maxsize: 5
reporter:
  method: majority
  output_jsonl: resultados/estres_resumen.jsonl
  print_console: true
  # step_secs 5->2, window_secs 20->8 (S13): capturas reales del robot
  # mostraban el nivel global en pantalla varios SEGUNDOS por detrás de lo
  # que el video mostraba en ese instante (una expresión extrema con
  # A=Alto 96% seguía leyendo BAJO; el badge llegó a ALTO recién cuando la
  # persona ya estaba calmada de nuevo). Con ventana de 20s + paso de 5s el
  # panel podía tardar mucho en reflejar un cambio real. 8s/2s sigue
  # promediando ruido de frame a frame pero reacciona varias veces más
  # rápido. Si vuelve a sentirse parpadeante (cambia de nivel por un
  # instante suelto), subir window_secs antes que step_secs.
  step_secs: 2
  thresholds:
    low: 0.75
    med: 1.75
  window_secs: 8
thresholds:
  face_timeout_ticks: 3
  pred_conf: 0.55
  quality_pose: 0.35
  stale_frames: 20
tick_size: 15
weights:
  A: 0.35
  B: 0.35
  C: 0.30
width: 640
